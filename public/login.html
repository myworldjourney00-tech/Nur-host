<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Nur Host</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">Nur Host</a>
    <a href="/signup.html" class="btn btn-outline btn-sm">Get Started</a>
  </nav>

  <div class="container">
    <div class="auth-box animate-fade-in">
      <h2 style="margin-bottom:1.5rem; text-align:center;">Sign In</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@domain.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; margin-top:10px;">
          <span>Sign In</span>
        </button>
      </form>
      <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted);">
        Don't have an account? <a href="/signup.html" style="color:var(--accent-blue); font-weight:600;">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing In...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Signed in successfully');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
        } else {
          showToast(data.error || 'Invalid credentials', true);
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In</span>';
        }
      } catch (err) {
        showToast('Connection error. Please try again.', true);
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span>';
      }
    });
  </script>
</body>
</html>

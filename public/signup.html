<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Nur Host</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">Nur Host</a>
    <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
  </nav>

  <div class="container">
    <div class="auth-box animate-fade-in">
      <h2 style="margin-bottom:1.5rem; text-align:center;">Create Your Account</h2>
      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@domain.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; margin-top:10px;">
          <span>Register Account</span>
        </button>
      </form>
      <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted);">
        Already have an account? <a href="/login.html" style="color:var(--accent-blue); font-weight:600;">Sign In</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating Account...';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password, confirmPassword })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Account created successfully. Redirecting...');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 900);
        } else {
          showToast(data.error || 'Registration failed', true);
          btn.disabled = false;
          btn.innerHTML = '<span>Register Account</span>';
        }
      } catch (err) {
        showToast('Network error. Please try again.', true);
        btn.disabled = false;
        btn.innerHTML = '<span>Register Account</span>';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Nur Host</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard.html" class="brand">Nur Host</a>
    <div class="nav-links">
      <a href="/websites.html" class="btn btn-outline btn-sm">My Websites</a>
      <button class="btn btn-danger btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:2.25rem;">
      <div>
        <h2 id="welcomeUser" class="animate-fade-in">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.95rem;">Overview of your deployments and hosted websites.</p>
      </div>
      <a href="/create.html" class="btn btn-primary">+ Create New Website</a>
    </div>

    <!-- Live Statistics -->
    <div class="grid-cards">
      <div class="card">
        <h3>Total Websites</h3>
        <h1 id="totalSites" style="margin-top:12px; font-size:2.5rem; color:var(--text-main);">0</h1>
      </div>
      <div class="card">
        <h3>Live Deployments</h3>
        <h1 id="liveSites" style="margin-top:12px; font-size:2.5rem; color:var(--success);">0</h1>
      </div>
    </div>

    <h3 style="margin:2.5rem 0 1rem;">Recent Deployments</h3>
    <div id="recentWebsitesList" class="grid-cards">
      <p style="color:var(--text-muted);">Loading deployments...</p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuth(true);
      if (user) {
        document.getElementById('welcomeUser').innerText = `Welcome back, ${user.fullName}`;
      }

      try {
        const res = await fetch('/api/websites');
        const data = await res.json();
        if (data.success) {
          document.getElementById('totalSites').innerText = data.stats.total;
          document.getElementById('liveSites').innerText = data.stats.deployed;

          const list = document.getElementById('recentWebsitesList');
          list.innerHTML = '';

          if (data.websites.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted);">No websites deployed yet. Create your first website to get started.</p>';
            return;
          }

          data.websites.slice(0, 4).forEach(site => {
            const fullUrl = `${window.location.origin}/u/${site.slug}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>${site.name}</h3>
              <p style="font-size:0.85rem; margin-bottom:12px;">Slug: <code>${site.slug}</code></p>
              <div class="status-indicator live" style="margin-bottom:18px;">
                <span class="status-dot"></span>
                <span>${site.status}</span>
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <a href="${fullUrl}" target="_blank" class="btn btn-outline btn-sm">Visit Site</a>
                <a href="/edit.html?id=${site.id}" class="btn btn-primary btn-sm">Edit</a>
              </div>
            `;
            list.appendChild(card);
          });
        }
      } catch (err) {
        showToast('Failed to load dashboard metrics', true);
      }
    });
  </script>
</body>
</html>
